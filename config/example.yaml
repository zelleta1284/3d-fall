room:
  grid_size_m: 0.03
  obstacle_height_m: 0.08
  default_friction: 0.45
  friction_zones:
    - rect: [-0.1, -0.2, 0.9, 0.6]
      mu: 0.35
    - rect: [1.6, 0.1, 2.5, 0.9]
      mu: 0.3
    - rect: [0.2, 1.2, 1.8, 2.2]
      mu: 0.4

paths:
  - start: [0.3, 0.1]
    goal: [2.6, 1.8]
    count: 2400
  - start: [0.2, 1.6]
    goal: [3.3, 0.4]
    count: 1600

gait:
  step_length: 0.45
  turn_radius: 0.52
  lateral_std: 0.07
  speed_mps: 0.65

biomechanics:
  foot_clearance_m: 0.04
  cane: true
  shuffle_bias: 0.35
  reaction_time_s: 0.7

lighting:
  latitude: 37.7749
  longitude: -122.4194
  timezone_offset_hours: -8
  datetime_iso: "2026-02-11T16:00:00"
  glare_weight: 1.0
  ambient_weight: 0.3
  windows:
    - center: [2.0, 1.0, 1.2]
      normal: [0.0, -1.0, 0.0]
      width: 1.2
      height: 1.0
      transmittance: 0.7
  lights:
    - position: [1.0, 1.0, 2.2]
      intensity: 1.0
      range_m: 3.0

physics:
  enabled: true
  timestep: 0.02
  steps_per_point: 5
  body_radius: 0.2
  body_height: 1.2
  mass_kg: 70.0
  floor_friction: 0.6
  use_gui: false

risk:
  obstacle_distance_m: 0.5
  coverage_mode: full_grid
  coverage_weight: 0.35
  semantic_weight: 1.0
  glare_slip_weight: 0.6
  weights:
    obstacle: 1.4
    turn: 1.2
    glare: 0.6
    trip: 1.3
    slip: 1.2
    physics: 1.5

patient:
  age: 78
  gender: female
  fall_last_6_months: true
  fall_hospitalized: false
  can_get_out_of_bed: true
  assistive_aid: true
